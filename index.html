.hidden{display:none}

button{

  font-size:16px;
  font-weight:bold;
  border:none;
  border-radius:10px;
  cursor:pointer;

input{

  font-size:16px;
}

#selector, #categorySelector{

.scoreCard{

  margin:8px;
  padding:10px;
}

.scoreCard.leader{

  box-shadow:0 0 20px #ffd600;

}

.scorePoints{
  font-size:32px;
  color:#00e676;
}

#questionBox{
  background:#222;
  padding:20px;
  border-radius:14px;
  margin-top:20px;
}

function goNames(){
  names.innerHTML="";
  for(let i=0;i<playerCount.value;i++){
    names.innerHTML+=`<input placeholder="Jogador ${i+1}" id="p${i}"><br>`;
  }
  screen1.classList.add("hidden");
  screen2.classList.remove("hidden");
}

function startGame(){
  for(let i=0;i<playerCount.value;i++){
    players.push(document.getElementById("p"+i).value || "Jogador "+(i+1));
    scores.push(0);
  }
  currentPlayer=Math.floor(Math.random()*players.length);
  selector.innerText=players[currentPlayer];
  updateScoreboard();
  screen2.classList.add("hidden");
  screen3.classList.remove("hidden");
}

function updateScoreboard(){
  scoreboard.innerHTML="";
  let max=Math.max(...scores);
  players.forEach((p,i)=>{
    const div=document.createElement("div");
    div.className="scoreCard"+(scores[i]===max && max>0?" leader":"");
    div.innerHTML=`<strong>${p}</strong><div class="scorePoints">${scores[i]}</div>`;
    scoreboard.appendChild(div);
  });
}

function sortCategory(){
  questionBox.classList.add("hidden");
  let i=0;
  interval=setInterval(()=>{
    categorySelector.innerText=categories[i%3].toUpperCase();
    i++;
  },120);

  setTimeout(()=>{
    clearInterval(interval);
    currentCategory=categories[Math.floor(Math.random()*3)];
    categorySelector.innerText=currentCategory.toUpperCase();
    askQuestion();
  },2000);
}

function askQuestion(){
  const list=questions[currentCategory];
  currentQuestion=list[Math.floor(Math.random()*list.length)];
  category.innerText=currentCategory.toUpperCase();
  question.innerText=currentQuestion.q;
  answer.innerText="Resposta: "+currentQuestion.a;
  answer.classList.add("hidden");
  resultBtns.classList.add("hidden");
  questionBox.classList.remove("hidden");
}

function showAnswer(){
  answer.classList.remove("hidden");
  resultBtns.classList.remove("hidden");
}

function correct(){
  scores[currentPlayer]++;
  updateScoreboard();
  if(scores[currentPlayer]>=10){
    screen3.classList.add("hidden");
    screen4.classList.remove("hidden");
    winner.innerText="🎉 Vencedor: "+players[currentPlayer];
  }else{
    sortCategory();
  }
}

function wrong(){
  currentPlayer=(currentPlayer+1)%players.length;
  selector.innerText=players[currentPlayer];
  sortCategory();
}
